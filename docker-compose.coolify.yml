services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/api
    restart: always
    environment:
      - SERVICE_URL_API
      - PORT=${PORT:-8080}
      - APP_PORT=${PORT:-8080}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PUBLIC_URL=${SERVICE_FQDN_API:-${SERVICE_URL_API}}
      # Meta WhatsApp Cloud API credentials
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-whatsapp_gateway_verify_token}
      - META_APP_SECRET=${META_APP_SECRET:-}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_API_VERSION=${META_API_VERSION:-v19.0}
      # API Security Token (auto-generated by Coolify or custom)
      - API_ACCESS_TOKEN=${API_ACCESS_TOKEN:-${SERVICE_PASSWORD_64_APITOKEN}}
      # Default Chatwoot Account & Inbox mapping
      - DEFAULT_ACCOUNT_ID=${DEFAULT_ACCOUNT_ID:-1}
      - DEFAULT_INBOX_ID=${DEFAULT_INBOX_ID:-1}
      # Database connection strings (PostgreSQL + Redis)
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_64_POSTGRES:-postgres}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-chatwoot_production}?sslmode=disable
      - REDIS_URL=redis://:${SERVICE_PASSWORD_64_REDIS:-redis}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -qO- http://localhost:8080/health || exit 1'
      interval: 20s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/worker
    restart: always
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_API_VERSION=${META_API_VERSION:-v19.0}
      - DEFAULT_ACCOUNT_ID=${DEFAULT_ACCOUNT_ID:-1}
      - DEFAULT_INBOX_ID=${DEFAULT_INBOX_ID:-1}
      - DATABASE_URL=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_64_POSTGRES:-postgres}@${DATABASE_HOST:-postgres}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-chatwoot_production}?sslmode=disable
      - REDIS_URL=redis://:${SERVICE_PASSWORD_64_REDIS:-redis}@${REDIS_HOST:-redis}:${REDIS_PORT:-6379}/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: 'postgres:16-alpine'
    restart: always
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot_production}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES:-postgres}
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}'
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SERVICE_PASSWORD_64_REDIS:-redis}"]
    volumes:
      - 'redis:/data'
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_64_REDIS:-redis}
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG'
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres:
  redis:
